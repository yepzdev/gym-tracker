<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYM tracker</title>
    <link rel="manifest" href="manifest.json">
	<link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>GYM tracker</h1>
    <p>Welcome to the GYM tracker. Here you can log your workouts and track your progress over time.</p>
    
    <h2>Log a Workout</h2>
    <form>
        <label for="workout-name">Workout Name:</label>
        <input type="text" id="workout-name" name="workout-name"><br>
        <label for="workout-date">Date:</label>
        <input type="date" id="workout-date" name="workout-date"><br>
        <label for="workout-duration">Duration (minutes):</label>
        <input type="number" id="workout-duration" name="workout-duration"><br>
        <input type="submit" value="Log Workout">
    </form>
    
    <h2>View Workouts</h2>
    <p>Coming soon...</p>
    <button id="install-button" style="display: none;">Instalar</button>

    <!-- Script principal que registra el SW y maneja la instalación -->
    <script src="app.js"></script>
</body>
</html>
